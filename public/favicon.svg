<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* el corazón sigue al tema de la pestaña; el destello no. Al quedarse
       violeta en claro y en oscuro es el punto fijo por el que se reconoce el
       icono de reojo en una barra de pestañas. El violeta es el del
       .flair-circle de global.css */
    .corazon { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .corazon { stroke: #ffffff; }
    }
    .destello { stroke: #7b61ff; }
  </style>
  <path class="corazon" d="M11.537 19.542l-7.037 -6.97a5 5 0 1 1 7.5 -6.566a5 5 0 0 1 8.212 5.693" />
  <!-- a 16px el trazo fino desaparece: acá se queda en el 2 del svg, y es la
       plantilla del OG la que lo adelgaza para los tamaños grandes -->

  <path class="destello" d="M19 22.5a4.75 4.75 0 0 1 3.5 -3.5a4.75 4.75 0 0 1 -3.5 -3.5a4.75 4.75 0 0 1 -3.5 3.5a4.75 4.75 0 0 1 3.5 3.5" />
</svg>
